<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Lecture Lab</title>
  <style>
    /* 기본 레이아웃 */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #222;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { margin: 0 0 0.5rem; }
    header p { color: #666; margin: 0; }

    /* 프로젝트 카드 그리드 */
    .project_grid {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .project_card {
      display: block;
      height: 100%;
      box-sizing: border-box;
      padding: 20px;
      background: #fff;
      border: 1px solid #e3e3e6;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    .project_card:hover { border-color: #888; transform: translateY(-2px); }
    .project_num { font-size: 0.85rem; color: #999; }
    .project_title { margin: 4px 0 12px; font-size: 1.15rem; }
    .project_status {
      display: inline-block;
      font-size: 0.8rem;
      padding: 2px 10px;
      border-radius: 999px;
      background: #eee;
      color: #777;
    }

    /* 링크 미연결 상태: 클릭 비활성화 */
    .project_card.is_pending {
      pointer-events: none;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Lecture Lab</h1>
      <p>실습 자료 모음</p>
    </header>

    <!-- 프로젝트 목록: 링크 연결 시 href 를 실제 주소로 바꾸고 is_pending 클래스와 aria-disabled 를 제거 -->
    <ul class="project_grid">
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">01</span>
          <h2 class="project_title">할일 목록 리스트</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">02</span>
          <h2 class="project_title">클로드 활용 스네이크 게임</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">03</span>
          <h2 class="project_title">개인 프로파일</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">04</span>
          <h2 class="project_title">주식 일기</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">05</span>
          <h2 class="project_title">4축 로봇암 시뮬레이터</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
      <li>
        <a class="project_card is_pending" href="#" aria-disabled="true">
          <span class="project_num">06</span>
          <h2 class="project_title">이북 쇼핑몰</h2>
          <span class="project_status">준비 중</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
